name: Production site health
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  check:
    if: vars.MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://hhbc-sunday-night-worship.netlify.app' }}
    steps:
      - name: Check public site and database readiness
        shell: bash
        run: |
          set -euo pipefail
          for route in / /api/health /api/getEvents /api/sermons; do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "${SITE_URL%/}${route}")
            echo "$route HTTP $code"
            test "$code" = "200"
          done
